# first half is deployment.yaml file

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: db
    component: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
       project: roboshop
       tier: db
       component: mongodb
  # Pod      
  template:
    metadata:
      namespace: roboshop
      labels:
       project: roboshop
       tier: db
       component: mongodb
    spec:
      containers:
      - name: mongodb
        image: joindevops/mongodb:4.0.0
        ports:
        - containerPort: 80
---
# second half is service.yaml file (default clusterIP)
apiVersion: v1
kind: Service
metadata:
   namespace: roboshop
   name: mongodb
   # service labels
   labels:
      project: roboshop
      tier: db
      component: mongodb
spec:      
  # Service uses the below labels from the selector to select the pods
   selector:
    project: roboshop
    tier: db
    component: mongodb
   ports:
   - protocol: TCP
     port: 80 # service port
     targetPort: 80 # container port
          
        